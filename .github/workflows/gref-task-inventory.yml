name: GREF one-time task inventory
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gref-task-inventory.yml'

permissions:
  contents: read

jobs:
  task-ids:
    if: github.actor == 'Barusss'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public task IDs through secured SSH
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.GREF_SSH_PRIVATE_KEY_B64 }}
          SSH_KNOWN_HOSTS: ${{ secrets.GREF_SSH_KNOWN_HOSTS }}
          GREF_SSH_HOST: ${{ vars.GREF_SSH_HOST }}
          GREF_SSH_USER: ${{ vars.GREF_SSH_USER }}
          GREF_SSH_PORT: ${{ vars.GREF_SSH_PORT }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 --decode > "$HOME/.ssh/gref_actions"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/gref_actions" "$HOME/.ssh/known_hosts"
          ssh -T -p "$GREF_SSH_PORT" -i "$HOME/.ssh/gref_actions" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes \
            -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            "$GREF_SSH_USER@$GREF_SSH_HOST" \
            "php8.2 /home/t/ttvvgg5r/ttvvgg5r.beget.tech/public_html/api.php" \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["ok"]; [print("%s | %s | %s | %s | %s" % (t["id"],t["assignee"],t["status"],t["deadline"],t["title"])) for t in data["tasks"]]'
