name: GREF INDEX SSH

on:
  push:
    branches: [main]
    paths:
      - '.gref/commands/*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gref-index-commands
  cancel-in-progress: false

jobs:
  beget:
    if: github.actor == 'Barusss'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install SSH credentials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GREF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.GREF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo 'Missing GREF_SSH_PRIVATE_KEY or GREF_SSH_KNOWN_HOSTS' >&2
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/gref_actions"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/gref_actions" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/gref_actions" >/dev/null
      - name: Check SSH and PHP
        env:
          GREF_SSH_HOST: ${{ vars.GREF_SSH_HOST }}
          GREF_SSH_USER: ${{ vars.GREF_SSH_USER }}
          GREF_SSH_PORT: ${{ vars.GREF_SSH_PORT }}
          GREF_SSH_SCRIPT_PATH: ${{ vars.GREF_SSH_SCRIPT_PATH }}
        run: python3 scripts/gref_bridge.py --check
      - name: Apply newly added commands
        if: github.event_name == 'push'
        env:
          GREF_SSH_HOST: ${{ vars.GREF_SSH_HOST }}
          GREF_SSH_USER: ${{ vars.GREF_SSH_USER }}
          GREF_SSH_PORT: ${{ vars.GREF_SSH_PORT }}
          GREF_SSH_SCRIPT_PATH: ${{ vars.GREF_SSH_SCRIPT_PATH }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: python3 scripts/gref_bridge.py --apply-new
